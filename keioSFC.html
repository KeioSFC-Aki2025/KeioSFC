// UDツリーのメイン描画関数
function drawUDTree(hit) {
  const canvas = $('udCanvas');
  const ctx = canvas.getContext('2d');
  const errDiv = $('udError');
  errDiv.style.display = 'none';

  // ★ 追加: UD 情報を持たないデータでは、その旨を表示して終了する
  if (!hasUDInfo()){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    errDiv.textContent = 'このデータには係り受け（UD）情報が含まれていないため、UDツリーは表示できません。「UD表示 OFF」で通常の文表示・文章全体表示をご利用ください。';
    errDiv.style.display = 'block';
    return;
  }
  
  // 1. データのパース
  let words = [];
  let rootNode = null;
  const wordMap = new Map();

  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(hit.rawSentence, "application/xml");
    const wnodes = Array.from(doc.getElementsByTagName('w'));
    
    if (wnodes.length === 0) throw new Error("wタグが見つかりません。");

    // ★ 追加: チェックボックスから表示内容を決定
    const displayOptions = [];
    if ($('udOpt_original').checked) displayOptions.push('original');
    if ($('udOpt_text').checked) displayOptions.push('textContent');
    if ($('udOpt_root').checked) displayOptions.push('root');
    if ($('udOpt_pos').checked) displayOptions.push('pos');
    // デフォルトフォールバック
    if (displayOptions.length === 0) {
        displayOptions.push('original');
        $('udOpt_original').checked = true; // フォールバック時はチェックをON
    }

    wnodes.forEach(wn => {
      const id = parseInt(wn.getAttribute(UD_WID), 10);
      const headId = parseInt(wn.getAttribute(UD_HEAD), 10);
      
      // ★ 修正: チェックボックスに応じて表示テキストを構築
      const nodeTexts = [];
      displayOptions.forEach(opt => {
          if (opt === 'original') {
              nodeTexts.push(wn.getAttribute('original') || wn.textContent.trim());
          } else if (opt === 'textContent') {
              nodeTexts.push(wn.textContent.trim());
          } else if (opt === 'root') {
              // 'root' が空なら '-' を表示
              nodeTexts.push(wn.getAttribute('root') || '-');
          } else if (opt === 'pos') {
              // 'pos' が空なら '-' を表示
              nodeTexts.push(wn.getAttribute('pos') || '-');
          }
      });
      const textLines = nodeTexts;

      const pos = wn.getAttribute('pos') || 'その他';
      const udType = wn.getAttribute(UD_LABEL) || '';
      
      if (isNaN(id) || isNaN(headId)) {
          // udFrom が空や不正な値の場合はスキップ (例: V7.3のサンプルデータ '●' (wordId=1, udFrom="24", udTo=""))
          // ただし、これがエラーの原因になる可能性もある
          if (isNaN(id)) throw new Error(`wordId が不正です: ${wn.outerHTML}`);
          // headId が不正な場合は、ひとまず自分自身を指すようにしてエラー回避
          console.warn(`udFrom が不正なため、 ${id} を仮ルートとして扱います: ${wn.outerHTML}`);
      }

     const node = {
        id: id,
        textLines: textLines, 
        pos: pos,
        headId: isNaN(headId) ? id : headId,
        udType: udType,
        children: [],
        level: -1,
        x: 0,
        y: 0
      };
      words.push(node);
      wordMap.set(id, node);
    });

    // 親子関係の構築とルートの特定
    words.forEach(node => {
      if (node.id === node.headId) {
        rootNode = node;
      } else {
        const head = wordMap.get(node.headId);
        if (head) {
          head.children.push(node);
        } else {
          // headId が存在しない場合 (例: 0 や範囲外)
          console.warn(`ID ${node.headId} の親ノードが見つかりません (ノード ${node.id})`);
          if (!rootNode) { // まだルートが未定なら、これを暫定ルートにする
            rootNode = node;
          }
        }
      }
    });

    if (!rootNode) {
        // self-loop がない場合、udFrom="0" などを探す
        const zeroHead = words.find(w => w.headId === 0);
        if (zeroHead) {
            rootNode = zeroHead;
        } else if (words.length > 0) {
            // それでもない場合、udFrom が自分以外を指しているが、
            // その headId が見つからない最初のノードをルートとみなす
             console.warn("ルートノード (headId=id or headId=0) が見つかりません。暫定ルートを適用します。");
             rootNode = words.find(w => w.headId !== w.id && !wordMap.has(w.headId)) || words[0];
        } else {
             throw new Error("描画する単語がありません。");
        }
    }

  } catch (e) {
    errDiv.textContent = `UDデータのパースに失敗しました: ${e.message}`;
    errDiv.style.display = 'block';
    return;
  }

  // 2. レイアウト計算 (レベル決定 - 葉から)
  let maxLevel = 0;
  function calculateLevel(node) {
    if (node.children.length === 0) {
      node.level = 0;
    } else {
      let maxChildLevel = 0;
      node.children.forEach(child => {
        calculateLevel(child); // 再帰的に子を計算
        if (child.level > maxChildLevel) {
          maxChildLevel = child.level;
        }
      });
      node.level = maxChildLevel + 1;
    }
    if (node.level > maxLevel) {
      maxLevel = node.level;
    }
  }
  
  // wordMapにある全ノードを対象に、未計算のノードからレベルを計算
  words.forEach(node => {
      if(node.level === -1) {
          // 接続されていない孤立ノードや、
          // 循環参照によって calculateLevel(rootNode) から漏れたノード
          // のレベルを計算する
          try {
            calculateLevel(node);
          } catch(e) {
            // 循環参照エラーなど
            console.error("レベル計算中にエラー:", e);
            node.level = 0; // 暫定的に0
          }
      }
  });


  // 3. 描画設定
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = '14px "Hiragino Sans", "Noto Sans JP", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // const boxHeight = 30; // ★ 削除
  const boxPaddingY = 50; // 箱と箱のY間隔
  const boxPaddingX = 10; // 箱と箱のX間隔
  let totalWidth = 0;
  
  // ★ 修正: 複数行に対応したレイアウト計算
  const lineHeight = 16; // 1行の高さ (14pxフォント + 2px隙間)
  const nodeMetrics = new Map();
  words.sort((a,b) => a.id - b.id); // wordId順にソート

  let currentX = 20; // 左右マージン
  
  words.forEach(node => {
      let maxWidth = 0;
      // ★ node.text ではなく node.textLines を使用
      node.textLines.forEach(line => {
          const metrics = ctx.measureText(line);
          if (metrics.width > maxWidth) {
              maxWidth = metrics.width;
          }
      });
      
      const boxWidth = Math.max(40, maxWidth + 16); // 最小幅40px, 左右パディング8px
      // ★ 高さを動的に計算 (上下パディング4px)
      const boxHeight = node.textLines.length * lineHeight + 8; 
      
      nodeMetrics.set(node.id, { width: boxWidth, height: boxHeight, lineHeight: lineHeight });
      
      node.x = currentX + (boxWidth / 2);
      currentX += boxWidth + boxPaddingX;
  });
  totalWidth = currentX + 20; // 左右マージン

  // ★ 修正: Y座標をレベルごとの最大高さを考慮して決定
  const levelMaxHeight = new Array(maxLevel + 1).fill(0);
  words.forEach(node => {
      const metrics = nodeMetrics.get(node.id);
      if (metrics.height > levelMaxHeight[node.level]) {
          levelMaxHeight[node.level] = metrics.height;
      }
  });

  const levelYTop = new Array(maxLevel + 1).fill(0);
  let currentY_Layout = 20; // Top margin
  for (let l = maxLevel; l >= 0; l--) { // Top level (maxLevel) to Bottom level (0)
      levelYTop[l] = currentY_Layout;
      currentY_Layout += levelMaxHeight[l] + boxPaddingY;
  }
  const totalHeight = currentY_Layout + 20; // Add bottom margin (20 - boxPaddingY)

  words.forEach(node => {
      const metrics = nodeMetrics.get(node.id);
      // node.y を箱の「中央」Y座標として設定
      node.y = levelYTop[node.level] + (metrics.height / 2);
  });
  
  // キャンバスサイズを調整
  canvas.width = totalWidth;
  canvas.height = totalHeight; // ★ 修正

  // 4. 描画 (再度設定が必要)
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = '14px "Hiragino Sans", "Noto Sans JP", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;

  // 4a. 線の描画 (下から)
  words.forEach(node => {
    if (node.id === node.headId) return; // ルートは描画しない
    const head = wordMap.get(node.headId);
    if (!head) return; // 親が見つからない

    // ★ 修正: metrics から動的な高さを取得
    const nodeMetrics_child = nodeMetrics.get(node.id);
    const nodeMetrics_head = nodeMetrics.get(head.id);
    if (!nodeMetrics_child || !nodeMetrics_head) return; // 安全装置

    ctx.beginPath();
    ctx.moveTo(node.x, node.y - nodeMetrics_child.height / 2); // 子の上端
    ctx.lineTo(head.x, head.y + nodeMetrics_head.height / 2); // 親の下端
    ctx.stroke();
    
    // ★ 修正: udType を線の中央に描画 (Y座標の計算を修正)
    if (node.udType) {
        const midX = (node.x + head.x) / 2;
        // ★ Y座標もエッジ基準で中央を計算
        const midY = ( (node.y - nodeMetrics_child.height / 2) + (head.y + nodeMetrics_head.height / 2) ) / 2;
        
        ctx.font = '12px "Hiragino Sans", "Noto Sans JP", sans-serif';
        ctx.fillStyle = '#1f6f3a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const text = node.udType;
        const textMetrics = ctx.measureText(text);
        
        ctx.clearRect(midX - (textMetrics.width / 2) - 2, midY - 8, textMetrics.width + 4, 16);
        ctx.fillText(text, midX, midY);
        
        ctx.font = '14px "Hiragino Sans", "Noto Sans JP", sans-serif'; // 元に戻す
    }
  });

  // 4b. ノード(箱とテキスト)の描画 (上から)
  words.forEach(node => {
    const metrics = nodeMetrics.get(node.id);
    const x_box = node.x - metrics.width / 2; // 箱の左上X
    const y_box = node.y - metrics.height / 2; // 箱の左上Y
    const lineHeight = metrics.lineHeight;

    // ★ V7.5: posColors から動的に色を取得
    // ('その他' またはハードコード値をフォールバックとして使用)
    const colorInfo = posColors[node.pos] || posColors['その他'] || { bg: '#eafff4', border: '#57a070' };

    // 箱
    ctx.fillStyle = colorInfo.bg;
    ctx.fillRect(x_box, y_box, metrics.width, metrics.height);
    ctx.strokeStyle = colorInfo.border;
    ctx.strokeRect(x_box, y_box, metrics.width, metrics.height);
    
    // ★ 修正: 複数行のテキストを描画
    ctx.fillStyle = '#133';
    ctx.textBaseline = 'middle';
    
    // 垂直方向の開始位置を計算 (箱の上端 + 上パディング(4px) + 最初の行の半分の高さ)
    let y_text = y_box + 4 + (lineHeight / 2); 
    
    node.textLines.forEach(line => {
        ctx.fillText(line, node.x, y_text);
        y_text += lineHeight; // 次の行へ
    });
  });
}
/* ---------- debug helper ---------- */
window._debug = {
    getCurrentData: ()=> currentData, 
    getHits: ()=> hits, 
    getParsedSentences: ()=> parsedSentences,
    getDetectedAttrs: ()=> detectedAttributes,
    getDetectedSAttrs: ()=> detectedSAttributes,
    getHeaders: ()=> getCurrentHeaders(),
    getDataURL: ()=> DATA_URL,
    getSValues: ()=> sAttributeValues,
    getUDAttrs: ()=> ({wordId: UD_WID, head: UD_HEAD, label: UD_LABEL, available: hasUDInfo()}),
    reload: ()=> loadRemoteData()
};
</script>
